{
  "manifest_version": 2,
  "name": "piper-real-runtime",
  "version": "0.2.3+openarmsim.1",
  "description": "Task Skill for the registered native four-CAN replay chain; exact artifacts, owned cancellation, defaults offline. Legacy UDS contracts retained separately.",
  "skill_document": "SKILL.md",
  "gateway_url": "http://127.0.0.1:19014",
  "required_tools": [
    "piper_real.capabilities",
    "piper_real.state",
    "piper_real.observe",
    "piper_real.prepare_task",
    "piper_real.recover",
    "piper_real.run_task",
    "piper_real.cancel_task"
  ],
  "profiles": {
