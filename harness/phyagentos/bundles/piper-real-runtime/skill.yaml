      "dataflow": "profiles/runtime/dataflow.yaml",
      "startup_timeout_s": 30,
      "required_binaries": [
        "gateway"
      ],
      "required_assets": [
        "profiles/runtime/provider.py",
        "profiles/runtime/runtime_bridge.py",
        "profiles/runtime/run_provider.sh",
        "profiles/runtime/endpoint_lease.py",
        "profiles/runtime/gateway.yaml"
      ]
    }
  },
  "artifacts": {
    "resolver": "registry",
    "nodes": {
      "gateway": {
        "artifact_id": "gateway-1.1.1-linux-x86_64-tar-gz",
        "version": "1.1.1",
        "platform": "linux",
        "arch": "x86_64",
        "artifact_type": "executable_tar_gz",
        "entrypoint": "gateway",
        "sha256": "dcf6a7a6e4136c9c203d6ede191db161c34ee0d6955a618a3bc752769359673f"
      }
    }
  }
}
